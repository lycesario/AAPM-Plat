<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自动化广告投放个人中心管理平台 · 高保真原型</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
html[data-theme="dark"]{
  --bg:#0a0c15; --bg2:#0c0f1a; --panel:#111527; --panel2:#161b31; --elev:#1b2139;
  --line:#1f2540; --line2:#2b3354;
  --ink:#e9edfb; --ink2:#9aa5c4; --ink3:#5d6a89;
  --brand:#4f6cff; --brand2:#8b5cf6; --brand-bg:rgba(79,108,255,.14);
  --gold:#f0b90b; --gold-bg:rgba(240,185,11,.10);
  --ok:#12c48b; --ok-bg:rgba(18,196,139,.11);
  --bad:#f2455f; --bad-bg:rgba(242,69,95,.11);
  --warn:#f0b90b;
  --shadow:0 14px 46px rgba(0,0,0,.5);
  --glow:0 0 0 1px rgba(79,108,255,.25),0 10px 34px rgba(79,108,255,.12);
}
html[data-theme="light"]{
  --bg:#f3f5fc; --bg2:#edf0f9; --panel:#ffffff; --panel2:#f7f9fe; --elev:#ffffff;
  --line:#e3e8f4; --line2:#d2daea;
  --ink:#131a2c; --ink2:#55607c; --ink3:#939db6;
  --brand:#2f52e0; --brand2:#7038e0; --brand-bg:rgba(47,82,224,.09);
  --gold:#a8790a; --gold-bg:rgba(240,185,11,.14);
  --ok:#0a9f70; --ok-bg:rgba(18,196,139,.12);
  --bad:#dc2f4a; --bad-bg:rgba(242,69,95,.09);
  --warn:#a8790a;
  --shadow:0 14px 38px rgba(28,40,74,.14);
  --glow:0 0 0 1px rgba(47,82,224,.18),0 8px 28px rgba(47,82,224,.10);
}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
b{font-weight:660}em{font-style:normal}a{color:inherit;text-decoration:none;cursor:pointer}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- 布局骨架 ---------------- */
.wb{display:flex;height:100vh;overflow:hidden}
.side{width:242px;flex:0 0 242px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.content{flex:1;overflow-y:auto;padding:22px 26px 70px;position:relative}

/* ---------------- 侧栏 ---------------- */
.side-brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:0 0 34px;box-shadow:var(--glow)}
.side-brand b{font-size:14.5px;letter-spacing:.2px;display:block}
.side-brand em{font-size:10.5px;color:var(--ink3);display:block;margin-top:1px}
.role-switch{margin:4px 12px 8px;position:relative}
.role-switch select{width:100%;appearance:none;background:var(--elev);border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:7px 26px 7px 10px;font-size:12px;font-family:inherit;cursor:pointer}
.role-switch:after{content:"\25BE";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ink3);pointer-events:none;font-size:11px}
.role-switch .rs-lb{font-size:10px;color:var(--ink3);letter-spacing:1.5px;margin-bottom:5px;text-transform:uppercase}
.side-nav{flex:1;overflow-y:auto;padding:4px 10px 14px}
.nav-group{font-size:10px;color:var(--ink3);letter-spacing:1.6px;text-transform:uppercase;padding:14px 8px 5px}
.nav-group .ng-d{font-size:10px;color:var(--ink3);letter-spacing:.2px;text-transform:none;opacity:.72;font-weight:400;display:block}
.nav-item{display:flex;align-items:center;gap:9px;padding:8.5px 10px;border-radius:9px;color:var(--ink2);font-size:13px;cursor:pointer;margin:1px 0;position:relative;transition:background .15s,color .15s}
.nav-item:hover{background:var(--panel2);color:var(--ink)}
.nav-item.on{background:var(--brand-bg);color:var(--ink);font-weight:620}
.nav-item.on:before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav-item .ni{width:18px;text-align:center;font-size:13.5px;flex:0 0 18px;opacity:.9}
.nav-item .cnt{margin-left:auto;font-size:10px;background:var(--bad-bg);color:var(--bad);padding:1px 6px;border-radius:8px;font-family:var(--mono)}
.nav-item .cnt.k{background:var(--gold-bg);color:var(--gold)}
.nav-item.locked{opacity:.34;cursor:not-allowed}
.nav-item.locked:hover{background:none;color:var(--ink2)}
.side-foot{border-top:1px solid var(--line);padding:10px 14px 12px}
.env-chip{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink3);margin-bottom:9px}
.env-chip i{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.side-user{display:flex;align-items:center;gap:9px}
.uav{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:0 0 30px}
.side-user b{font-size:12.5px;display:block}
.side-user em{font-size:10.5px;color:var(--ink3);display:block}

/* ---------------- 顶栏 ---------------- */
.topbar{height:54px;flex:0 0 54px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:40}
.topnav{display:flex;align-items:center;gap:1px;overflow-x:auto;flex:1 1 auto;min-width:0;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.tn-item{position:relative;display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;color:var(--ink2);font-size:12.5px;font-weight:560;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;flex:0 0 auto}
.tn-item:hover{color:var(--ink);background:var(--panel2)}
.tn-item.on{color:var(--brand);background:var(--brand-bg);font-weight:660}
.tn-item.on:after{content:"";position:absolute;left:13px;right:13px;bottom:-10px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.tn-item .tn-badge{font-style:normal;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;font-family:var(--mono)}
.tn-item.on .tn-badge{box-shadow:0 0 0 3px var(--brand-bg)}
.top-search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 12px;color:var(--ink3);font-size:12px;cursor:pointer;flex:0 1 auto;width:250px;min-width:0;overflow:hidden}
.top-search .ph{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-search:hover{border-color:var(--line2)}
.top-search kbd{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--elev);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--ink3)}
.top-acts{display:flex;gap:8px;align-items:center}

/* ---------------- 副栏 ---------------- */
.subbar{height:38px;flex:0 0 38px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--line);background:var(--bg2);font-size:12px;color:var(--ink2)}
.sub-sp{flex:1}
.crumb{display:flex;align-items:center;gap:7px;font-size:12.5px;min-width:0}
.crumb .cb-g{color:var(--ink3);font-weight:500;white-space:nowrap}
.crumb .cb-sep{color:var(--ink3);font-style:normal;opacity:.55}
.crumb b{font-weight:660;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-right{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--ink3);white-space:nowrap}
.sub-right .cb-env{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:10px;letter-spacing:.5px;font-family:var(--mono)}

/* ---------------- 通用元件 ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:var(--elev);color:var(--ink);border-radius:9px;padding:7px 14px;font-size:12.5px;font-family:inherit;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}
.btn.p:hover{filter:brightness(1.12);color:#fff}
.btn.danger{background:var(--bad-bg);border-color:rgba(242,69,95,.35);color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn.warn{background:var(--gold-bg);border-color:rgba(240,185,11,.35);color:var(--gold)}
.btn.ok{background:var(--ok-bg);border-color:rgba(18,196,139,.35);color:var(--ok)}
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:7px}
.btn.lg{padding:9px 20px;font-size:13px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;line-height:1.5}
.tag.b{background:var(--brand-bg);color:var(--brand);border-color:transparent}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.tag.warn{background:var(--gold-bg);color:var(--gold);border-color:transparent}
.tag.gold{background:var(--gold-bg);color:var(--gold);border-color:rgba(240,185,11,.25)}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--gold)}.dot.idle{background:var(--ink3)}.dot.b{background:var(--brand)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:660}
.panel-h .sub{font-size:11px;color:var(--ink3);font-weight:400;margin-left:auto;display:flex;gap:8px;align-items:center}
.panel-b{padding:16px}
.panel-b.tight{padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px;position:relative;overflow:hidden;transition:border-color .18s,transform .18s}
.kpi:hover{border-color:var(--line2)}
.kpi.hl{border-color:rgba(79,108,255,.4)}
.kpi .k-lb{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:6px;padding-right:6px}
.kpi .k-v{font-size:24px;font-weight:750;letter-spacing:-.8px;margin-top:5px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpi .k-v.sm{font-size:19px}
.kpi .k-foot{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--ink3);flex-wrap:wrap}
.kpi .spark{position:absolute;right:10px;bottom:10px;opacity:.9}
.k-pair{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;color:var(--ink3);border:1px dashed var(--line2);border-radius:5px;padding:1px 6px}
.ring{width:44px;height:44px;flex:0 0 44px}

table.dt{width:100%;border-collapse:collapse;font-size:12.3px}
.dt th{text-align:left;font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.6px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:2;white-space:nowrap}
.dt td{padding:9.5px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.dt tbody tr{transition:background .12s}
.dt tbody tr:hover{background:var(--panel2)}
.dt tbody tr:last-child td{border-bottom:none}
.dt .r{text-align:right}.dt .c{text-align:center}
.dt .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dt .link{color:var(--brand);cursor:pointer;font-weight:560}
.dt .link:hover{text-decoration:underline}
.dt tr.rowlink{cursor:pointer}
.dt .tbl-wrap{max-height:520px;overflow:auto}
.tbar{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar .sp{flex:1}
.inp{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:6.5px 11px;font-size:12.3px;font-family:inherit;outline:none;transition:border .15s;max-width:100%}
.inp:focus{border-color:var(--brand)}
.inp::placeholder{color:var(--ink3)}
select.inp{cursor:pointer}
textarea.inp{resize:vertical;line-height:1.7}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.fld>label{font-size:11.5px;color:var(--ink2);font-weight:560}
.fld .hint{font-size:10.5px;color:var(--ink3)}
.fld .req:after{content:" *";color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.g13{display:grid;grid-template-columns:1fr 2fr;gap:12px}
.g31{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.pager{display:flex;align-items:center;gap:6px;padding:11px 14px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
.pager .pg{min-width:26px;height:26px;border:1px solid var(--line2);border-radius:7px;display:grid;place-items:center;cursor:pointer;background:var(--elev);font-family:var(--mono);padding:0 6px}
.pager .pg.on{background:var(--brand-bg);border-color:var(--brand);color:var(--brand);font-weight:660}

.stepper{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 0}
.stepper .stp{display:flex;flex-direction:column;align-items:center;min-width:92px;flex:1;position:relative}
.stepper .stp:before{content:"";position:absolute;top:11px;left:-50%;right:50%;height:2px;background:var(--line2)}
.stepper .stp:first-child:before{display:none}
.stepper .stp.done:before{background:var(--ok)}
.stepper .stp.act:before{background:var(--brand)}
.stepper .stp .si{width:23px;height:23px;border-radius:50%;background:var(--elev);border:2px solid var(--line2);display:grid;place-items:center;font-size:10.5px;font-family:var(--mono);position:relative;z-index:1;color:var(--ink3)}
.stepper .stp.done .si{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper .stp.act .si{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 4px var(--brand-bg)}
.stepper .stp.bad .si{border-color:var(--bad);color:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
.stepper .stp.hold .si{border-color:var(--gold);color:var(--gold)}
.stepper .stp span{font-size:10.5px;color:var(--ink3);margin-top:7px;text-align:center;line-height:1.4}
.stepper .stp.act span{color:var(--ink);font-weight:600}

.tl{position:relative;padding-left:18px}
.tl:before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1.5px;background:var(--line2)}
.tl-item{position:relative;padding:0 0 15px 10px}
.tl-item:before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--ink3);border:2px solid var(--panel)}
.tl-item.ok:before{background:var(--ok)}
.tl-item.warn:before{background:var(--gold)}
.tl-item.bad:before{background:var(--bad)}
.tl-item.brand:before{background:var(--brand)}
.tl-item .tl-t{font-size:12px;font-weight:600}
.tl-item .tl-d{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.65}

.note{display:flex;gap:9px;border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.7;margin-bottom:12px;border:1px solid}
.note .ni{font-size:13px;flex:0 0 16px}
.note.info{background:var(--brand-bg);border-color:rgba(79,108,255,.25);color:var(--ink)}
.note.ok{background:var(--ok-bg);border-color:rgba(18,196,139,.25);color:var(--ink)}
.note.warn{background:var(--gold-bg);border-color:rgba(240,185,11,.3);color:var(--ink)}
.note.bad{background:var(--bad-bg);border-color:rgba(242,69,95,.3);color:var(--ink)}
.note b{font-weight:660}

/* 规则标注（致命规则浮现） */
.rule-anno{display:none;border:1.5px dashed var(--gold);background:var(--gold-bg);border-radius:10px;padding:9px 13px;font-size:11.5px;color:var(--ink);line-height:1.72;margin:8px 0}
.rule-anno b{color:var(--gold)}
.wb.rule-on .rule-anno{display:block}
.wb.rule-on [data-rulechip]{outline:1.5px dashed var(--gold);outline-offset:2px;border-radius:6px}

/* 抽屉 / 模态 / 命令面板 */
.drawer-mask,.modal-mask,.pal-mask{position:fixed;inset:0;background:rgba(4,6,14,.62);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .22s;z-index:80}
.drawer-mask.on,.modal-mask.on,.pal-mask.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:-620px;width:620px;max-width:94vw;height:100vh;background:var(--panel);border-left:1px solid var(--line2);z-index:90;transition:right .28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.wide{width:820px}
.drawer.on{right:0}
.drawer-h{display:flex;align-items:center;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.drawer-h b{font-size:14.5px}
.drawer-h .x{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;cursor:pointer;color:var(--ink3);border:1px solid var(--line)}
.drawer-h .x:hover{color:var(--ink);border-color:var(--line2)}
.drawer-b{flex:1;overflow-y:auto;padding:18px 20px 30px}
.drawer-f{border-top:1px solid var(--line);padding:13px 20px;display:flex;gap:9px;background:var(--panel);flex:0 0 auto}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);width:480px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:16px;z-index:95;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow)}
.modal.wide{width:720px}
.modal.wide2{width:900px}
.modal.wide3{width:1080px}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.modal-h{padding:16px 20px 0;font-size:15px;font-weight:700;position:relative;padding-right:46px}
.modal-h .tag{margin-left:7px;vertical-align:1px}
.mh-sub{font-size:11.5px;color:var(--ink3);font-weight:500;margin-top:5px;line-height:1.65}
.mh-x{position:absolute;right:14px;top:13px;width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink3);font-size:15px;transition:.15s;z-index:2}
.mh-x:hover{background:var(--panel2);color:var(--ink)}
.modal-b{padding:14px 20px;max-height:64vh;overflow-y:auto}
.modal-b::-webkit-scrollbar{width:8px}
.modal-b::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
.modal-f{padding:0 20px 18px;display:flex;gap:9px;justify-content:flex-end;align-items:center}
.modal-f .fgrow{flex:1;font-size:11.5px;color:var(--ink3);line-height:1.5}
.modal-f .fr{display:flex;gap:9px}
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%) scale(.98);width:620px;max-width:92vw;background:var(--panel);border:1px solid var(--line2);border-radius:16px;z-index:95;opacity:0;pointer-events:none;transition:.18s;box-shadow:var(--shadow);overflow:hidden}
.palette.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.palette .pal-in{width:100%;background:transparent;border:none;outline:none;color:var(--ink);font-size:14.5px;padding:16px 20px;border-bottom:1px solid var(--line);font-family:inherit}
.pal-list{max-height:52vh;overflow-y:auto;padding:8px}

.toasts{position:fixed;top:16px;right:18px;z-index:120;display:flex;flex-direction:column;gap:9px;max-width:400px}

.mrow .span3{grid-column:span 3}
.mrow .span4{grid-column:span 4}

.ci.on.ok .cbox{background:var(--ok);border-color:var(--ok)}

.ci.on.bad .cbox{background:var(--bad);border-color:var(--bad)}

.ci .cd{font-size:10.8px;color:var(--ink3);margin-top:3px;line-height:1.6}

.rc.on.bad{border-color:var(--bad);background:var(--bad-bg);box-shadow:none}

.tag-pick{display:flex;gap:6px;flex-wrap:wrap}

<script>

/* ============================================================

const AC={};

AC.line=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||180);const n=+cv.dataset.n||26;const sets=JSON.parse(cv.dataset.sets||'null')||[{seed:'l1',c:C.brand,t:.8},{seed:'l2',c:C.gold,t:-.2},{seed:'l3',c:C.ok,t:.3}];const all=sets.map(s=>AC.series(s.seed,n,45,16,s.t));const flat=[].concat.apply([],all);const mn=Math.min.apply(null,flat)*.86,mx=Math.max.apply(null,flat)*1.08;const L=34,R=8,T=12,B=20;AC.grid(x,L,w-R,T,h-B,C,4,v=>v);const X=i=>L+(w-L-R)*i/(n-1),Y=v=>h-B-((v-mn)/(mx-mn))*(h-B-T);all.forEach((s,si)=>{const p=catmull(s.map((v,i)=>({x:X(i),y:Y(v)})));x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.strokeStyle=sets[si].c;x.lineWidth=2;x.stroke();x.beginPath();x.arc(X(n-1),Y(s[n-1]),3,0,7);x.fillStyle=sets[si].c;x.fill()})};
AC.dual=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||180);const n=24;const a=AC.series(cv.dataset.seed+'A',n,42,15,.6),b=AC.series(cv.dataset.seed+'B',n,30,11,.15);const mn=Math.min.apply(null,a.concat(b))*.85,mx=Math.max.apply(null,a.concat(b))*1.1;const L=34,R=8,T=12,B=22;AC.grid(x,L,w-R,T,h-B,C,4,v=>v);const X=i=>L+(w-L-R)*i/(n-1),Y=v=>h-B-((v-mn)/(mx-mn))*(h-B-T);[[a,C.brand],[b,C.gold]].forEach(function(pair){const s=pair[0],col=pair[1];const p=s.map((v,i)=>({x:X(i),y:Y(v)}));x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.strokeStyle=hexA(col,.3);x.lineWidth=5;x.lineJoin='round';x.stroke();x.beginPath();p.forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.strokeStyle=col;x.lineWidth=2;x.stroke();p.filter((_,i)=>i%6===0).forEach(q=>{x.beginPath();x.arc(q.x,q.y,2.6,0,7);x.fillStyle=col;x.fill()})})};
AC.bars=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||170);const n=+cv.dataset.n||16;const s=AC.series(cv.dataset.seed||'b',n,48,20,0);const mx=Math.max.apply(null,s)*1.12;const L=34,R=8,T=12,B=20;AC.grid(x,L,w-R,T,h-B,C,4,v=>v);const bw=(w-L-R)/n*.62;const g=x.createLinearGradient(0,T,0,h-B);g.addColorStop(0,C.brand);g.addColorStop(1,hexA(C.brand2,.55));s.forEach((v,i)=>{const cx=L+((w-L-R)/n)*(i+.5);const bh=(h-B-T)*(v/mx);const y=h-B-bh;rr(x,cx-bw/2,y,bw,bh,3);x.fillStyle=(cv.dataset.hl&&i===+cv.dataset.hl)?C.gold:g;x.fill()})};
AC.stacked=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||180);const n=8;const cols=[C.brand,C.brand2,C.gold,C.ok,C.bad];const sets=cols.map((c,i)=>AC.series(cv.dataset.seed+'st'+i,n,20+i*3,7,0));const tot=[];for(let i=0;i<n;i++)tot.push(sets.reduce((a,s)=>a+s[i],0));const mx=Math.max.apply(null,tot)*1.1;const L=40,R=8,T=12,B=22;AC.grid(x,L,w-R,T,h-B,C,4,v=>Math.round(mx*v/100/10)*10);const bw=(w-L-R)/n*.56;sets.forEach((s,si)=>{s.forEach((v,i)=>{const below=sets.slice(0,si).reduce((a,q)=>a+q[i],0);const y0=h-B-(h-B-T)*((below+v)/mx),y1=h-B-(h-B-T)*(below/mx);const cx=L+((w-L-R)/n)*(i+.5);const bh=Math.max(1,y1-y0-1);x.fillStyle=cols[si];rr(x,cx-bw/2,y0,bw,bh,2);x.fill()})})};
AC.hbars=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||180);const rows=JSON.parse(cv.dataset.data||'null');if(!rows)return;const L=Math.min(150,w*.36),R=64,T=8,B=8;const mx=Math.max.apply(null,rows.map(r=>r[1]));const rh=(h-T-B)/rows.length;rows.forEach((r,i)=>{const y=T+i*rh+rh/2;const bw=Math.max(3,(w-L-R)*(r[1]/mx));const col=r[2]||(r[1]>110?C.bad:(r[1]>100?C.gold:C.ok));x.fillStyle=C.panel2;rr(x,L,y-6,w-L-R,12,6);x.fill();const g=x.createLinearGradient(L,0,L+bw,0);g.addColorStop(0,hexA(col,.6));g.addColorStop(1,col);x.fillStyle=g;rr(x,L,y-6,bw,12,6);x.fill();x.fillStyle=C.ink2;x.font='11px '+FF();x.textAlign='right';x.textBaseline='middle';x.fillText(r[0],L-9,y);x.fillStyle=col;x.font='600 11px '+FF();x.textAlign='left';x.fillText(r[1]+(r[3]||''),Math.min(L+bw+8,w-R+40),y)})};
AC.donut=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||160);const data=JSON.parse(cv.dataset.data||'[{"v":58},{"v":26},{"v":16}]');const cols=(cv.dataset.colors||[C.brand,C.brand2,C.gold,C.ok,C.bad,C.ink3].join(',')).split(',');const tot=data.reduce((a,d)=>a+d.v,0);const cx=w/2,cy=h/2,R=Math.min(w,h)/2-6,r=R*.62;let ang=-Math.PI/2;data.forEach((d,i)=>{const a2=ang+Math.PI*2*d.v/tot;x.beginPath();x.arc(cx,cy,R,ang,a2);x.arc(cx,cy,r,a2,ang,true);x.closePath();x.fillStyle=cols[i%cols.length];x.fill();x.strokeStyle=C.panel;x.lineWidth=2;x.stroke();ang=a2});x.fillStyle=C.ink;x.textAlign='center';x.textBaseline='alphabetic';x.font='700 19px '+FF();x.fillText(cv.dataset.center||'',cx,cy+(cv.dataset.sub?2:8));if(cv.dataset.sub){x.fillStyle=C.ink3;x.font='10px '+FF();x.fillText(cv.dataset.sub,cx,cy+18)}};
AC.radar=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||200);const axes=JSON.parse(cv.dataset.axes||'["A","B","C","D","E","F"]');const A=JSON.parse(cv.dataset.a||'[82,64,76,58,88,71]');const Bs=JSON.parse(cv.dataset.b||'[70,72,68,74,62,80]');const cx=w/2,cy=h/2+4,R=Math.min(w,h)/2-26,n=axes.length;for(let k=1;k<=4;k++){x.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+Math.PI*2*i/n;const px=cx+Math.cos(a)*R*k/4,py=cy+Math.sin(a)*R*k/4;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.strokeStyle=k===4?C.line2:C.line;x.lineWidth=1;x.stroke()}axes.forEach((t,i)=>{const a=-Math.PI/2+Math.PI*2*i/n;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);x.strokeStyle=C.line;x.stroke();x.fillStyle=C.ink3;x.font='10.5px '+FF();x.textAlign=Math.abs(Math.cos(a))<.3?'center':(Math.cos(a)>0?'left':'right');x.textBaseline=Math.abs(Math.sin(a))<.3?'middle':(Math.sin(a)>0?'top':'bottom');x.fillText(t,cx+Math.cos(a)*(R+9),cy+Math.sin(a)*(R+8))});[[A,C.brand],[Bs,C.gold]].forEach(function(pair){const arr=pair[0],col=pair[1];x.beginPath();arr.forEach((v,i)=>{const a=-Math.PI/2+Math.PI*2*i/n;const px=cx+Math.cos(a)*R*v/100,py=cy+Math.sin(a)*R*v/100;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.fillStyle=hexA(col,.16);x.fill();x.strokeStyle=col;x.lineWidth=2;x.stroke();arr.forEach((v,i)=>{const a=-Math.PI/2+Math.PI*2*i/n;x.beginPath();x.arc(cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100,2.6,0,7);x.fillStyle=col;x.fill()})})};
AC.gauge=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||140);const v=+(cv.dataset.v||64),mx=+(cv.dataset.max||100);const cx=w/2,cy=h*.76,R=Math.min(w/2-14,h*.62);x.lineWidth=13;x.lineCap='round';x.strokeStyle=C.line2;x.beginPath();x.arc(cx,cy,R,Math.PI,Math.PI*2);x.stroke();const col=v>=mx*.8?C.ok:(v>=mx*.55?C.brand:C.bad);const g=x.createLinearGradient(cx-R,0,cx+R,0);g.addColorStop(0,C.brand);g.addColorStop(1,col);x.strokeStyle=g;x.beginPath();x.arc(cx,cy,R,Math.PI,Math.PI+Math.PI*Math.min(1,v/mx));x.stroke();x.fillStyle=C.ink;x.textAlign='center';x.font='700 23px '+FF();x.fillText(cv.dataset.label||v+'%',cx,cy-2);x.fillStyle=C.ink3;x.font='10.5px '+FF();x.fillText(cv.dataset.sub||'',cx,cy+16)};
AC.scatter=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||250);const d=JSON.parse(cv.dataset.data||'[]');const L=46,R=18,T=18,B=32;x.strokeStyle=C.line;x.strokeRect(L,T,w-L-R,h-T-B);x.fillStyle=C.ink3;x.font='10px '+FF();x.textAlign='center';x.textBaseline='top';for(let i=0;i<=4;i++){x.fillText(i*25,L+(w-L-R)*i/4,h-14)}x.textAlign='right';x.textBaseline='middle';for(let i=0;i<=4;i++)x.fillText((i*25)+'',L-7,h-B-(h-T-B)*i/4);x.setLineDash([4,4]);for(let i=1;i<=3;i++){x.beginPath();x.moveTo(L+(w-L-R)*i/4,T);x.lineTo(L+(w-L-R)*i/4,h-B);x.strokeStyle=C.line;x.stroke();x.beginPath();x.moveTo(L,T+(h-T-B)*i/4);x.lineTo(w-R,T+(h-T-B)*i/4);x.strokeStyle=C.line;x.stroke()}x.setLineDash([]);d.forEach(p=>{const px=L+(w-L-R)*p.x/100,py=h-B-(h-T-B)*p.y/100;const rad=5+(p.r||20)/9;const col=p.c==='ok'?C.ok:(p.c==='warn'?C.gold:(p.c==='bad'?C.bad:C.brand));x.beginPath();x.arc(px,py,rad,0,7);x.fillStyle=hexA(col,.2);x.fill();x.strokeStyle=col;x.lineWidth=1.6;x.stroke();x.beginPath();x.arc(px,py,2,0,7);x.fillStyle=col;x.fill();if(p.t){x.fillStyle=C.ink2;x.font='9.5px '+FF();x.textAlign='left';x.textBaseline='middle';x.fillText(p.t,px+rad+3,py)}})};
AC.heat=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||150);const rows=+cv.dataset.rows||5,cols=+cv.dataset.cols||14;const r=prng(cv.dataset.seed||'h');const gap=3;const cw=(w-gap*(cols-1))/cols,chh=(h-gap*(rows-1))/rows;for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const v=r();const col=v>.86?C.brand:(v>.7?hexA(C.brand2,.7):(v>.5?hexA(C.brand,.4):(v>.28?hexA(C.brand,.18):C.panel2)));x.fillStyle=col;rr(x,j*(cw+gap),i*(chh+gap),cw,chh,3);x.fill()}};
AC.waterfall=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||190);const d=JSON.parse(cv.dataset.data||'[]');if(!d.length)return;const L=42,R=10,T=16,B=34;let run=0;const pts=d.map((it,i)=>{if(i===0||i===d.length-1||it.abs){return {s:0,e:it.v,abs:true}}const s=run;run+=it.v;return {s:s,e:run}});const all=[].concat.apply([],[0],[0]).concat(pts.reduce((a,p)=>a.concat([p.s,p.e]),[]));const mn=Math.min.apply(null,all),mx=Math.max.apply(null,all);const Y=v=>h-B-((v-mn)/(mx-mn))*(h-T-B);AC.grid(x,L,w-R,T,h-B,C,4,v=>Math.round(mn+(mx-mn)*v/100));const bw=(w-L-R)/d.length*.54;pts.forEach((p,i)=>{const cx=L+((w-L-R)/d.length)*(i+.5);const y0=Y(Math.max(p.s,p.e)),y1=Y(Math.min(p.s,p.e));const up=(p.e>=p.s);const col=p.abs?C.brand:(up?C.ok:C.bad);x.fillStyle=col;rr(x,cx-bw/2,y0,bw,Math.max(2,y1-y0),3);x.fill();x.fillStyle=C.ink3;x.font='10px '+FF();x.textAlign='center';x.textBaseline='alphabetic';x.fillText(d[i].l,cx,h-12);x.fillStyle=col;x.font='600 10px '+FF();x.fillText((p.abs?'':(d[i].v>0?'+':''))+d[i].v,cx,y0-5)})};
AC.stackline=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||170);const n=24;const sd=cv.dataset.seed||'k';const s1=AC.series(sd+'1',n,44,13,.5),s2=AC.series(sd+'2',n,26,9,.2),s3=AC.series(sd+'3',n,14,6,.1),s4=AC.series(sd+'4',n,8,4,0);const sets=[[s1,C.brand],[s2,C.brand2],[s3,C.gold],[s4,C.ok]];const L=40,R=10,T=12,B=22;const topAll=[];for(let i=0;i<n;i++)topAll.push(s1[i]+s2[i]+s3[i]+s4[i]);const mx=Math.max.apply(null,topAll)*1.1;AC.grid(x,L,w-R,T,h-B,C,4,v=>Math.round(mx*v/100/10)*10);const X=i=>L+(w-L-R)*i/(n-1);let base=new Array(n).fill(0);sets.forEach(function(pair){const s=pair[0],col=pair[1];const top=base.map((b,i)=>b+s[i]);const g=x.createLinearGradient(0,T,0,h-B);g.addColorStop(0,hexA(col,.55));g.addColorStop(1,hexA(col,.05));x.beginPath();top.forEach((v,i)=>{const py=h-B-(h-B-T)*v/mx;i?x.lineTo(X(i),py):x.moveTo(X(i),py)});for(let i=n-1;i>=0;i--)x.lineTo(X(i),h-B-(h-B-T)*base[i]/mx);x.closePath();x.fillStyle=g;x.fill();x.beginPath();top.forEach((v,i)=>{const py=h-B-(h-B-T)*v/mx;i?x.lineTo(X(i),py):x.moveTo(X(i),py)});x.strokeStyle=col;x.lineWidth=1.8;x.stroke();base=top})};
AC.box=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||170);const groups=JSON.parse(cv.dataset.data||'null');if(!groups)return;const L=36,R=10,T=14,B=26;const mx=Math.max.apply(null,groups.map(g=>g.e))*1.08;AC.grid(x,L,w-R,T,h-B,C,4,v=>Math.round(mx*v/100));const W=(w-L-R)/groups.length;groups.forEach((g,i)=>{const cx=L+W*(i+.5);const Y=v=>h-B-(h-B-T)*v/mx;x.strokeStyle=C.line2;x.lineWidth=1.4;x.beginPath();x.moveTo(cx,Y(g.a));x.lineTo(cx,Y(g.e));x.stroke();const bw=W*.42;x.fillStyle=hexA(C.brand,.55);rr(x,cx-bw/2,Y(g.d),bw,Math.max(2,Y(g.b)-Y(g.d)),4);x.fill();x.strokeStyle=C.brand;x.stroke();x.beginPath();x.moveTo(cx-bw/2,Y(g.c));x.lineTo(cx+bw/2,Y(g.c));x.strokeStyle=C.gold;x.lineWidth=2.4;x.stroke();x.fillStyle=C.ink3;x.font='10.5px '+FF();x.textAlign='center';x.textBaseline='alphabetic';x.fillText(g.n,cx,h-10)})};
AC.gantt=(cv)=>{const {x,w,h,C}=setupCanvas(cv,+cv.dataset.h||200);const rows=JSON.parse(cv.dataset.data||'[]');const L=6,R=6,T=6,B=6;const rh=(h-T-B)/rows.length;rows.forEach((r,i)=>{const y=T+i*rh+rh/2;const x0=L+(w-L-R)*r.s/100, x1=L+(w-L-R)*r.e/100;x.fillStyle=C.panel2;rr(x,L,y-5,w-L-R,10,5);x.fill();const col=r.k==='crit'?C.bad:(r.k==='done'?C.ok:(r.k==='ms'?C.ink3:C.brand));const g=x.createLinearGradient(x0,0,x1,0);g.addColorStop(0,hexA(col,.6));g.addColorStop(1,col);x.fillStyle=g;rr(x,x0,y-5,Math.max(3,x1-x0),10,5);x.fill()})};
AC.draw=function(cv){const t=cv.dataset.achart;try{
  if(t==='spark')AC.spark(cv);else if(t==='ring')AC.ring(cv);else if(t==='area')AC.area(cv);
  else if(t==='line')AC.line(cv);else if(t==='dual')AC.dual(cv);else if(t==='bars')AC.bars(cv);
  else if(t==='stacked')AC.stacked(cv);else if(t==='hbars')AC.hbars(cv);else if(t==='donut')AC.donut(cv);
  else if(t==='radar')AC.radar(cv);else if(t==='gauge')AC.gauge(cv);else if(t==='scatter')AC.scatter(cv);
  else if(t==='heat')AC.heat(cv);else if(t==='waterfall')AC.waterfall(cv);else if(t==='stackline')AC.stackline(cv);
  else if(t==='box')AC.box(cv);else if(t==='gantt')AC.gantt(cv);
}catch(e){if(window.__dbg)console.warn('chart',t,e)}};
AC.drawAll=function(root){(root||document).querySelectorAll('canvas[data-achart]').forEach(cv=>AC.draw(cv))};
window.addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{AC.drawAll(document.querySelector('#content'));AC.drawAll(document.querySelector('#drawer'));},180)});

  (o.rule?'<div class="rule-anno"><b>⚑ '+esc(o.rule)+'</b><br>'+esc(o.ruleHow||'')+'</div>':'')+'</div>';

 (rows.length?rows.map(r=>'<tr '+(r._row||'')+' class="'+(r._cls||'')+' '+(o.rowlink?'rowlink':'')+'">'+cols.map(c=>'<td class="'+(c.r?'r':'')+' '+(c.c?'c':'')+'" '+(c.mono?'data-m':'' )+'>'+(c.f?c.f(r):esc(r[c.k]!=null?r[c.k]:''))+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+cols.length+'"><div class="empty"><span class="em-i">◍</span>'+esc(o.empty||'没有符合条件的数据')+'</div></td></tr>')+
 '</tbody></table></div>'};

const STATE={route:'dash',theme:'dark',ruleOn:false,group:0,q:'',flags:{},tab:{},fav:[]};

let RULES=[];function R(id){return RULES.filter(r=>r.id===id)[0]||null}
function toast(msg,kind){
  const d=document.createElement('div');
  d.className='toast '+(kind||'');
  d.innerHTML='<span>'+(kind==='bad'?'⛔':(kind==='warn'?'⚠':(kind==='ok'?'✓':'ⓘ')))+'</span><div>'+msg+'</div>';
  $('#toasts').appendChild(d);
  setTimeout(()=>{d.style.opacity='0';d.style.transform='translateX(14px)';d.style.transition='.3s'},3600);
  setTimeout(()=>d.remove(),4000);
}
function openModal(html,wide){const m=$('#modal');m.className='modal'+(wide===2?' wide2':wide===3?' wide3':wide?' wide':'');m.innerHTML=html;$('[data-mmask]').classList.add('on');m.classList.add('on');AC.drawAll(m)}
function closeModal(){$('[data-mmask]').classList.remove('on');$('#modal').classList.remove('on')}
function openDrawer(title,html,wide){
  $('#drawer').className='drawer'+(wide?' wide':'');
  $('#drawer').innerHTML='<div class="drawer-h"><b>'+title+'</b><span class="x" data-act="close-drawer">✕</span></div><div class="drawer-b">'+html+'</div>';

}
function closeDrawer(){$('[data-dmask]').classList.remove('on');$('#drawer').classList.remove('on')}

function showDlg(fn,el){CURDLG=fn;CUR_EL=el||null;FSTATE=(fn.init&&fn.init())||{};openModal(fn(CUR_EL),DLGW)}

function fsSet(k,v){FSTATE[k]=v}
function fsTog(k){FSTATE[k]=!FSTATE[k]}

/* ⌘K */
let palHits=[],palIdx=0;
function palItems(){
  const a=[];
  NAV.forEach(g=>g.items.forEach(i=>a.push({t:i.n,k:g.g+' › 页面',i:i.i,go:i.id})));
  (window.PAL_EXTRA||[]).forEach(x=>a.push(x));
  return a;
}
function openPalette(){
  const all=palItems();
  const q=(STATE.q||'').trim().toLowerCase();
  palHits=q?all.filter(x=>(x.t+x.k).toLowerCase().indexOf(q)>=0).slice(0,40):all.slice(0,40);
  palIdx=0;renderPal();
  $('#palette').classList.add('on');$('[data-pmask]').classList.add('on');
  const inp=$('#palInput');inp.value=STATE.q||'';setTimeout(()=>inp.focus(),40);
}
function closePalette(){$('#palette').classList.remove('on');$('[data-pmask]').classList.remove('on')}
function renderPal(){
  const L=$('#palList');
  if(!palHits.length){L.innerHTML='<div class="pal-empty">没有匹配「'+esc(STATE.q)+'」的页面或动作</div>';return}
  let html='',lastK=null;
  palHits.forEach((x,i)=>{
    if(x.k!==lastK){html+='<div class="pal-hd">'+esc(x.k)+'</div>';lastK=x.k}
    html+='<div class="pal-item'+(i===palIdx?' on':'')+'" data-pal="'+i+'"><span class="pi">'+x.i+'</span><span>'+esc(x.t)+'</span><span class="pk">↵</span></div>';
  });
  L.innerHTML=html;
}
function palGo(i){const x=palHits[i];if(!x)return;closePalette();STATE.q='';if(x.go)go(x.go);else if(x.act)doAct(x.act,{})}
$('#palInput').addEventListener('input',e=>{STATE.q=e.target.value;const all=palItems();const q=STATE.q.trim().toLowerCase();palHits=q?all.filter(x=>(x.t+x.k).toLowerCase().indexOf(q)>=0).slice(0,40):all.slice(0,40);palIdx=0;renderPal()});
$('#palInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palIdx=Math.min(palIdx+1,palHits.length-1);renderPal()}
  else if(e.key==='ArrowUp'){e.preventDefault();palIdx=Math.max(palIdx-1,0);renderPal()}
  else if(e.key==='Enter'){e.preventDefault();palGo(palIdx)}
  else if(e.key==='Escape'){closePalette()}
});

function renderTopNav(){
  const el=$('#topNav');if(!el)return;
  el.innerHTML=NAV.map((g,i)=>'<div class="tn-item'+(STATE.group===i?' on':'')+'" data-topnav="'+i+'" title="'+esc(g.d||g.g)+'">'+esc(g.g)+'</div>').join('');
}
function goGroup(i){STATE.group=i;const g=NAV[i];if(g&&g.items.length)go(g.items[0].id);else renderTopNav()}
function renderNav(){
  const el=$('#sideNav');if(!el)return;
  el.innerHTML=NAV.map(g=>'<div class="nav-group">'+esc(g.g)+(g.d?'<span class="ng-d">'+esc(g.d)+'</span>':'')
    +g.items.map(i=>'<div class="nav-item'+(STATE.route===i.id?' on':'')+'" data-nav="'+i.id+'"><span class="ni">'+i.i+'</span><span class="sb-txt">'+esc(i.n)+'</span>'
    +(badgeOf(i)?'<span class="cnt'+(i.badgeClass||'')+'">'+badgeOf(i)+'</span>':'')+'</div>').join('')+'</div>').join('');
}
function renderCrumb(){
  const gi=navIndexOf(STATE.route);
  const g=gi>=0?NAV[gi]:null;
  const it=g?g.items.filter(x=>x.id===STATE.route)[0]:null;
  $('#crumb').innerHTML=(g?'<span class="cb-g">'+esc(g.g)+'</span><span class="cb-sep">/</span>':'')+'<b>'+esc(it?it.n:(V[STATE.route]?V[STATE.route].t:STATE.route))+'</b>';

}
function render(){
  const c=$('#content'); const v=V[STATE.route];
  if(!v){STATE.route=NAV[0].items[0].id;return render()}
  c.innerHTML=v.render();
  c.scrollTop=0;
  c.classList.remove('page-in'); void c.offsetWidth; c.classList.add('page-in');
  AC.drawAll(c);
  renderTopNav(); renderNav(); renderCrumb();
}
function go(id){
  if(!V[id]){toast('页面「'+id+'」不存在','warn');return}
  STATE.route=id; const gi=navIndexOf(id); if(gi>=0)STATE.group=gi;
  const el=$('#content'); if(el)el.innerHTML='';
  render();

/* 事件委托：单一 click 监听 */
function doAct(A,t,el){
  /* 通用 UI */
  if(A==='fold'){$('#wb').classList.toggle('folded');setTimeout(()=>AC.drawAll(document.querySelector('#content')),280);return}
  if(A==='theme'){
    STATE.theme=STATE.theme==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',STATE.theme);
    setTimeout(()=>{AC.drawAll(document.querySelector('#content'));AC.drawAll(document.querySelector('#drawer'))},60);
    toast('已切换为'+(STATE.theme==='dark'?'深色':'浅色')+'主题','ok'); return;
  }
  if(A==='rule-toggle'){
    STATE.ruleOn=!STATE.ruleOn;syncRuleUI();
    toast(STATE.ruleOn?'已开启业务规则标注：页面上的 ⚑ 区域即为该规则的落点，共 <b>'+RULES.length+'</b> 条规则':'已关闭规则标注','ok');
    return;
  }
  if(A==='bell'){toggleBell();return}
  if(A==='bell-all'){STATE.notifications.forEach(n=>n.read=true);syncBell();renderBell();toast('通知已全部标记为已读','ok');return}
  if(A==='bell-read'){const i=+t.getAttribute('data-i');if(STATE.notifications[i])STATE.notifications[i].read=true;syncBell();renderBell();return}
  if(A==='palette'){openPalette();return}
  if(A==='close-drawer'){closeDrawer();return}
  if(A==='close-modal'){dlgClose();return}
  if(A==='dlg-close'){dlgClose();return}
  // 任何以 dlg-done/ 提交类动作（save/submit/confirm/ok）开头的手势，先采集表单值
  if(/^(dlg-|.*-submit$|.*-save$|.*-confirm$|.*-ok$)/.test(A)){capDlg()}
  /* 弹窗表单状态机 */
  if(A==='fchk'){fsList(t.getAttribute('data-k'),+t.getAttribute('data-i'));reDlg();return}
  if(A==='fset'){fsSet(t.getAttribute('data-k'),t.getAttribute('data-v'));reDlg();return}
  if(A==='flist'){fsList(t.getAttribute('data-k'),t.getAttribute('data-v'));reDlg();return}
  if(A==='fstep'){const k=t.getAttribute('data-k');const d=+(t.getAttribute('data-d')||1);FSTATE[k]=(+fsGet(k,0))+d;reDlg();return}
  if(A==='frng'){
    const k=t.getAttribute('data-k');const v=+t.value;fsSet(k,v);
    const suf=t.getAttribute('data-suf')||'';
    const rv=t.parentElement?t.parentElement.querySelector('.rv'):null;
    if(rv)rv.textContent=v+suf;
    return;
  }
  if(A==='ftab'){STATE.tab[STATE.route]=t.getAttribute('data-v');render();return}
  if(A==='tab'){STATE.tab[STATE.route]=t.getAttribute('data-v');render();return}
  if(A==='flag'){const k=t.getAttribute('data-k')||('f'+(STATE.route));STATE.flags[k]=!STATE.flags[k];render();return}
  if(A==='search'){
    const q=(t.getAttribute('data-q')||'').toLowerCase();
    const tb=t.getAttribute('data-tb');
    if(tb){const rows=JSON.parse(tb||'[]');toast('在「'+esc(t.getAttribute('data-scope')||'当前页')+'」中匹配到 <b>'+rows.length+'</b> 条：'+rows.slice(0,3).map(esc).join('、'),rows.length?'ok':'warn')}
    else toast('已应用筛选：'+esc(q||'全部'),'ok');
    return;
  }
  /* 由各项目 spec 扩展 */
  if(window.ACT_EXTRA&&window.ACT_EXTRA[A]){window.ACT_EXTRA[A](t,el);return}
  toast('动作「'+A+'」已触发（演示数据）','');
}
